<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-color.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CogniVend — streamline vendor onboarding, activation, and annual renewal." />
    <title>CogniVend</title>
    <script>
      // Prevent flash of wrong theme — for "system" no class needed (CSS media query handles it)
      ;(function () {
        const t = localStorage.getItem("vendor-theme")
        if (t === "dark" || t === "light") document.documentElement.classList.add(t)
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
