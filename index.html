<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vendor Management Portal — streamline vendor onboarding, activation, and annual renewal." />
    <title>Vendor Portal</title>
    <script>
      // Prevent flash of wrong theme
      ;(function () {
        const theme = localStorage.getItem("vendor-theme")
        const sys = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.classList.add(theme === "dark" || theme === "light" ? theme : sys)
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
